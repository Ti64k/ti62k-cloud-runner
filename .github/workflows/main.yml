name: Ti62k Ultimate AI & RE Workstation

on:
  workflow_dispatch:
    inputs:
      auto_restart:
        description: 'Auto-respawn server before 6h limit?'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      session_minutes:
        description: 'Active session duration in minutes before sync & respawn'
        required: false
        default: '320'
        type: string

permissions:
  contents: read
  actions: write

concurrency:
  group: ti62k-workstation
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  cloud-workstation:
    runs-on: ubuntu-24.04
    timeout-minutes: 355

    steps:
      - name: Reclaim Runner Disk & Prepare Cache Directories
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          sudo mkdir -p /opt/re-tools /opt/agent-bins
          sudo chown -R "$USER:$USER" /opt/re-tools /opt/agent-bins

      - name: Setup Node.js 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Fetch Version Manifest from Private Vault
        env:
          GH_TOKEN: ${{ secrets.VAULT_PAT }}
          VAULT_REPO: ${{ secrets.VAULT_REPO }}
        run: |
          gh api "repos/${VAULT_REPO}/contents/bootstrap/versions.env" \
            -H "Accept: application/vnd.github.raw" > .versions.env

      - name: Restore Heavy RE & CLI Binary Cache
        id: restore-bins
        uses: actions/cache/restore@v4
        with:
          path: |
            /opt/re-tools
            /opt/agent-bins
          key: ti62k-bins-${{ hashFiles('.versions.env') }}
          restore-keys: |
            ti62k-bins-

      - name: Clone Private Vault Bootstrap Suite & Execute Bring-Up
        env:
          VAULT_REPO: ${{ secrets.VAULT_REPO }}
          VAULT_PAT: ${{ secrets.VAULT_PAT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PASS: ${{ secrets.SERVER_PASS }}
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
          TERMUX_SSH_PUBKEY: ${{ secrets.TERMUX_SSH_PUBKEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          AUTH_B64="$(printf 'x-access-token:%s' "${VAULT_PAT}" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${AUTH_B64}" \
            clone --depth 1 "https://github.com/${VAULT_REPO}.git" /opt/vault-bootstrap
          chmod +x /opt/vault-bootstrap/bootstrap/*.sh /opt/vault-bootstrap/bootstrap/starred-recipes/*.sh
          /opt/vault-bootstrap/bootstrap/run-all.sh
          sudo chmod -R a+rX /opt/re-tools /opt/agent-bins

      - name: Save Binary Cache
        if: steps.restore-bins.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            /opt/re-tools
            /opt/agent-bins
          key: ti62k-bins-${{ hashFiles('.versions.env') }}

      - name: Active Session & 10-Minute Encrypted Vault Auto-Save Loop
        env:
          VAULT_REPO: ${{ secrets.VAULT_REPO }}
          VAULT_PAT: ${{ secrets.VAULT_PAT }}
          SERVER_PASS: ${{ secrets.SERVER_PASS }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SESSION_MINUTES: ${{ inputs.session_minutes }}
        run: |
          /opt/vault-bootstrap/bootstrap/95-keepalive-loop.sh

      - name: Final Encrypted Vault Sync, Tailscale Logout & Auto-Respawn
        if: always()
        env:
          VAULT_REPO: ${{ secrets.VAULT_REPO }}
          VAULT_PAT: ${{ secrets.VAULT_PAT }}
          SERVER_PASS: ${{ secrets.SERVER_PASS }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          GH_TOKEN: ${{ github.token }}
          AUTO_RESTART: ${{ inputs.auto_restart }}
          REPO_FULL: ${{ github.repository }}
        run: |
          /opt/vault-bootstrap/bootstrap/99-shutdown.sh
